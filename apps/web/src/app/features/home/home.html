<mat-toolbar>
  <span>Document Workflow</span>
  <span class="spacer"></span>
  <button mat-button (click)="auth.logout()">
    <mat-icon>logout</mat-icon>
    Log out
  </button>
</mat-toolbar>

<main class="content">
  @if (auth.user(); as user) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-icon mat-card-avatar class="avatar">account_circle</mat-icon>
        <mat-card-title>{{ fullName() }}</mat-card-title>
        <mat-card-subtitle>Role: {{ user.role }} · ID: {{ user.sub }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        @if (expiresAt(); as exp) {
          <p>Token expires {{ exp | date: 'medium' }}</p>
        }
        <h3>Decoded token payload</h3>
        <pre>{{ user | json }}</pre>
      </mat-card-content>
    </mat-card>
  }
</main>
